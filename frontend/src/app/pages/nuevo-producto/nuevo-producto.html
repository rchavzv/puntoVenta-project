<app-header></app-header>
<div class="bg-slate-100 min-h-screen p-6">
  <h1 class="text-2xl font-bold mb-8">Inventario / Nuevo Producto</h1>
  <div class="bg-white rounded-2xl shadow-lg p-8">
    <div class="grid lg:grid-cols-2 gap-10">
      <!--Izquierda-->
      <div>
        <h2 class="text-2xl font-bold mb-6">Informacion Basica</h2>
        <div class="space-y-5">
          <div>
            <label class="font-medium block mb-2"> Nombre del producto </label>
            <input type="text" class="w-ful border rounded-lg p-3" placeholder="Perfume" />
          </div>
          <div>
            <label class="font-medium block mb-2"> SKU </label>
            <input type="text" class="w-ful border rounded-lg p-3" placeholder="Perfume" />
          </div>
          <div>
            <label class="font-medium block mb-2"> Descripcion </label>
            <textarea
              rows="4"
              class="w-ful border rounded-lg p-3"
              placeholder="Ingresa una descripcion..."
            ></textarea>
          </div>
        </div>
      </div>
      <!--Derecha-->
      <div>
        <h2 class="text-2xl font-bold mb-6">Precios y Stock</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="font-medum block mb-2"> Precio Compra </label>
            <input type="number" class="w-full border rounded-lg p-3" />
          </div>
          <div>
            <label class="font-medum block mb-2"> Precio Venta </label>
            <input type="number" class="w-full border rounded-lg p-3" />
          </div>
          <div>
            <label class="font-medum block mb-2"> Impuestos </label>
            <select class="w-full border rounded-lg p-3">
              <option>16% General</option>
            </select>
          </div>
          <div>
            <label class="font-medum block mb-2"> Stock Inicial </label>
            <input type="number" class="w-full border rounded-lg p-3" />
          </div>
          <div>
            <label class="font-medum block mb-2"> Stock Minimo </label>
            <input type="number" class="w-full border rounded-lg p-3" />
          </div>
          <div>
            <label class="font-medum block mb-2"> Proveedor </label>
            <select class="w-full border rounded-lg p-3">
              <option>Proveedor S.A.</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <!--Botones-->
    <div class="flex justify-center gap-6 mt-10">
      <button class="bg-blue-600 text-white px-12 py-4 rounded-xl">Registrar Producto</button>
      <button class="bg-gray-500 text-white px-12 py-4 rounded-xl">Cancelar</button>
    </div>
  </div>
</div>
