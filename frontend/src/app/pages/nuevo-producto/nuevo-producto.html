<app-header></app-header>

<div class="bg-slate-100 min-h-screen p-6">
  <h1 class="text-2xl font-bold mb-8">Inventario / Nuevo Producto</h1>

  <div class="bg-white rounded-2xl shadow-lg p-8">

    <div class="grid lg:grid-cols-2 gap-10">

      <!-- IZQUIERDA -->
      <div>
        <h2 class="text-2xl font-bold mb-6">Información Básica</h2>

        <div class="space-y-5">

          <!-- Nombre -->
          <div>
            <label class="font-medium block mb-2">Nombre del producto</label>
            <input type="text"
                   [(ngModel)]="producto.sysProductsName"
                   class="w-full border rounded-lg p-3"
                   placeholder="Perfume" />
          </div>

          <!-- SKU -->
          <div>
            <label class="font-medium block mb-2">SKU</label>
            <input type="text"
                   [(ngModel)]="producto.sysProductsSku"
                   class="w-full border rounded-lg p-3"
                   placeholder="P001" />
          </div>

          <!-- Descripción -->
          <div>
            <label class="font-medium block mb-2">Descripción</label>
            <textarea rows="4"
                      [(ngModel)]="producto.sysProductsDescription"
                      class="w-full border rounded-lg p-3"
                      placeholder="Ingresa una descripción..."></textarea>
          </div>

        </div>
      </div>

      <!-- DERECHA -->
      <div>
        <h2 class="text-2xl font-bold mb-6">Precios y Stock</h2>

        <div class="grid grid-cols-2 gap-4">

          <!-- Precio compra -->
          <div>
            <label class="font-medium block mb-2">Precio Compra</label>
            <input type="number"
                   [(ngModel)]="producto.sysProductsPurchasePrice"
                   class="w-full border rounded-lg p-3" />
          </div>

          <!-- Precio venta -->
          <div>
            <label class="font-medium block mb-2">Precio Venta</label>
            <input type="number"
                   [(ngModel)]="producto.sysProductsSalePrice"
                   class="w-full border rounded-lg p-3" />
          </div>

          <!-- Impuestos -->
          <div>
            <label class="font-medium block mb-2">Impuestos</label>
            <select [(ngModel)]="producto.sysProductsTax"
                    class="w-full border rounded-lg p-3">
              <option [value]="16">16% General</option>
            </select>
          </div>

          <!-- Stock -->
          <div>
            <label class="font-medium block mb-2">Stock Inicial</label>
            <input type="number"
                   [(ngModel)]="producto.sysProductsStock"
                   class="w-full border rounded-lg p-3" />
          </div>

          <!-- Stock mínimo -->
          <div>
            <label class="font-medium block mb-2">Stock Mínimo</label>
            <input type="number"
                   [(ngModel)]="producto.sysProductsMinStock"
                   class="w-full border rounded-lg p-3" />
          </div>

        </div>
      </div>

    </div>

    <!-- BOTONES -->
    <div class="flex justify-center gap-6 mt-10">

      <button (click)="guardarProducto()"
              class="bg-blue-600 text-white px-12 py-4 rounded-xl hover:bg-blue-700 transition">
        Registrar Producto
      </button>

      <button class="bg-gray-500 text-white px-12 py-4 rounded-xl hover:bg-gray-600 transition">
        Cancelar
      </button>

    </div>

  </div>
</div>
