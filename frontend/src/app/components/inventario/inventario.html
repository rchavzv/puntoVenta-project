<div class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition cursor-pointer">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-slate-800">Inventario</h2>

      <p class="text-gray-500 mt-2">Gestion de Inventario</p>
    </div>
  </div>
  <div class="flex flex-col gap-3 mt-6">
    <button
      (click)="consultarStock()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-medium transition"
    >
      Consultar Stock
    </button>
    <button
      (click)="nuevoProducto()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-medium transition"
    >
      Nuevo Producto
    </button>
  </div>
</div>
